
<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <!-- Власні стилі -->
    <link rel="stylesheet" href="css/style.css">

    <title>VILKA</title>
</head>

<body>

<!-- =========================================================
     ШАПКА
========================================================= -->

<header class="bg-white border-bottom">

    <div class="container py-3">

        <!-- Верхній рядок -->

        <div class="row align-items-center g-3">

            <!-- Логотип -->

            <div class="col-12 col-lg-3">

                <a
                    href="index.html"
                    class="logo vilka-logo"
                >
                    <img
                        src="img/vilka-logo.png"
                        alt="VILKA"
                    >
                </a>

            </div>

            <!-- Пошук -->

            <div class="col-12 col-lg-6">

                <input
                    type="text"
                    id="search"
                    class="form-control form-control-lg"
                    placeholder="Пошук товарів..."
                >

            </div>

            <!-- Кошик -->

            <div class="col-12 col-lg-3 text-lg-end">

                <button
                    id="cartButton"
                    class="btn btn-orange btn-lg w-100"
                    type="button"
                >
                    <i class="bi bi-cart3 me-2"></i>
                    Кошик

                    <span
                        id="cartCount"
                        class="badge bg-dark"
                    >
                        0
                    </span>

                </button>

            </div>

        </div>


        <!-- =================================================
             НАВІГАЦІЯ
        ================================================= -->

        <nav class="navbar navbar-expand-lg mt-3 p-0">

            <div class="container-fluid p-0">

                <!-- Мобільна кнопка -->

                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#mainNavigation"
                    aria-controls="mainNavigation"
                    aria-expanded="false"
                    aria-label="Відкрити меню"
                >
                    <i class="bi bi-list"></i>
                </button>


                <!-- Меню -->

                <div
                    class="collapse navbar-collapse"
                    id="mainNavigation"
                >

                    <ul class="navbar-nav gap-lg-2">

                        <!-- Каталог -->

                        <li class="nav-item dropdown">

                            <a
                                class="nav-link dropdown-toggle"
                                href="#"
                                id="catalogDropdown"
                                role="button"
                                data-bs-toggle="dropdown"
                                aria-expanded="false"
                            >
                                Каталог
                            </a>


                            <ul
                                class="dropdown-menu"
                                aria-labelledby="catalogDropdown"
                            >

                                <!-- Усі товари -->

                                <li>
                                    <a
                                        class="dropdown-item"
                                        href="index.html"
                                    >
                                        <i class="bi bi-bag me-2"></i>
                                        Усі товари
                                    </a>
                                </li>


                                <!-- Комп'ютери -->

                                <li>
                                    <a
                                        class="dropdown-item"
                                        href="index.html?category=computers"
                                    >
                                        <i class="bi bi-pc-display me-2"></i>
                                        Комп'ютери
                                    </a>
                                </li>


                                <!-- Телефони -->

                                <li>
                                    <a
                                        class="dropdown-item"
                                        href="index.html?category=phones"
                                    >
                                        <i class="bi bi-phone me-2"></i>
                                        Телефони
                                    </a>
                                </li>


                                <!-- Ноутбуки -->

                                <li>
                                    <a
                                        class="dropdown-item"
                                        href="index.html?category=laptops"
                                    >
                                        <i class="bi bi-laptop me-2"></i>
                                        Ноутбуки
                                    </a>
                                </li>


                                <!-- Аксесуари -->

                                <li>
                                    <a
                                        class="dropdown-item"
                                        href="index.html?category=accessories"
                                    >
                                        <i class="bi bi-headphones me-2"></i>
                                        Аксесуари
                                    </a>
                                </li>

                            </ul>

                        </li>


                        <!-- Оголошення -->

                        <li class="nav-item">

                            <a
                                class="nav-link"
                                href="announcements.html"
                            >
                                <i class="bi bi-megaphone me-2"></i>
                                Оголошення
                            </a>

                        </li>

                    </ul>

                </div>

            </div>

        </nav>

    </div>

</header>


<!-- =========================================================
     ОСНОВНИЙ КОНТЕНТ
========================================================= -->

<main class="container py-5">

    <!-- =====================================================
         ПОПУЛЯРНІ ТОВАРИ
    ====================================================== -->

    <section>

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h2 class="fw-bold mb-0">
                Популярні товари
            </h2>


            <select
                id="sort"
                class="form-select w-auto"
            >

                <option value="default">
                    Сортування
                </option>

                <option value="cheap">
                    Від дешевих
                </option>

                <option value="expensive">
                    Від дорогих
                </option>

            </select>

        </div>


        <!-- Товари з Django API -->

        <div
            id="products"
            class="row g-4"
        >
            <!-- JavaScript завантажить товари сюди -->
        </div>

    </section>


    <!-- =====================================================
         ОСТАННІ ОГОЛОШЕННЯ
    ====================================================== -->

    <section class="home-announcements-section mt-5 pt-4">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>

                <h2 class="fw-bold mb-1">
                    Останні оголошення
                </h2>

                <p class="text-light mb-0">
                    Нові товари від користувачів
                </p>

            </div>


            <a
                href="announcements.html"
                class="btn btn-orange"
            >
                Усі оголошення
            </a>

        </div>


        <!-- Оголошення з JavaScript -->

        <div
            id="homeAnnouncements"
            class="row g-4"
        >

            <div class="col-12 text-center">

                <p class="text-light">
                    Завантаження оголошень...
                </p>

            </div>

        </div>

    </section>

</main>


<!-- =========================================================
     FOOTER
========================================================= -->

<footer class="bg-dark text-white text-center py-4">

    <p class="mb-0">
        © 2026 VILKA
    </p>

</footer>


<!-- =========================================================
     BOOTSTRAP JS
========================================================= -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>


<!-- Основний JavaScript -->

<script src="js/script.js"></script>


<!-- Оголошення на головній -->

<script src="js/home-announcements.js"></script>


</body>

</html>
