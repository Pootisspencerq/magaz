<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">

    <title>VILKA</title>
</head>

<body>

<!-- ==========================================
     ШАПКА
========================================== -->

<header class="bg-white border-bottom">

    <div class="container py-3">

        <div class="row align-items-center g-3">

            <!-- Логотип -->

            <div class="col-12 col-lg-3">

                <a
                    href="index.html"
                    class="logo vilka-logo"
                >
                    <img
                        src="img/vilka-logo.png"
                        alt="VILKA"
                    >
                </a>

            </div>


            <!-- Пошук -->

            <div class="col-12 col-lg-6">

                <input
                    type="text"
                    id="search"
                    class="form-control form-control-lg"
                    placeholder="Пошук товарів..."
                >

            </div>


            <!-- Кошик -->

            <div class="col-12 col-lg-3 text-lg-end">

                <button
                    id="cartButton"
                    class="btn btn-orange btn-lg w-100"
                    type="button"
                >
                    🛒 Кошик

                    <span
                        id="cartCount"
                        class="badge bg-dark"
                    >
                        0
                    </span>

                </button>

            </div>

        </div>


        <!-- Навігація -->

        <nav class="mt-3">

            <a href="index.html">
                Каталог
            </a>

            <a href="#">
                Комп'ютери
            </a>

            <a href="#">
                Телефони
            </a>

            <a href="#">
                Ноутбуки
            </a>

            <a href="#">
                Аксесуари
            </a>

            <a href="announcements.html">
                Оголошення
            </a>

        </nav>

    </div>

</header>


<!-- ==========================================
     ОСНОВНИЙ КОНТЕНТ
========================================== -->

<main class="container py-5">


    <!-- ======================================
         ПОПУЛЯРНІ ТОВАРИ
    ======================================= -->

    <section>

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h2 class="fw-bold mb-0">
                Популярні товари
            </h2>


            <select
                id="sort"
                class="form-select w-auto"
            >

                <option value="default">
                    Сортування
                </option>

                <option value="cheap">
                    Від дешевих
                </option>

                <option value="expensive">
                    Від дорогих
                </option>

            </select>

        </div>


        <!-- Товари завантажуються з Django API -->

        <div
            id="products"
            class="row g-4"
        >
            <!-- JavaScript завантажить товари сюди -->
        </div>

    </section>


    <!-- ======================================
         ОСТАННІ ОГОЛОШЕННЯ
    ======================================= -->

    <section class="home-announcements-section mt-5 pt-4">

        <div
            class="d-flex justify-content-between align-items-center mb-4"
        >

            <div>

                <h2 class="fw-bold mb-1">
                    Останні оголошення
                </h2>

                <p class="text-light mb-0">
                    Нові товари від користувачів
                </p>

            </div>


            <a
                href="announcements.html"
                class="btn btn-orange"
            >
                Усі оголошення
            </a>

        </div>


        <!-- Тут JavaScript покаже оголошення -->

        <div
            id="homeAnnouncements"
            class="row g-4"
        >

            <div class="col-12 text-center">

                <p class="text-light">
                    Завантаження оголошень...
                </p>

            </div>

        </div>

    </section>


</main>


<!-- ==========================================
     FOOTER
========================================== -->

<footer class="bg-dark text-white text-center py-4">

    <p class="mb-0">
        © 2026 VILKA
    </p>

</footer>


<!-- ==========================================
     BOOTSTRAP JS
========================================== -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>


<!-- ==========================================
     ОСНОВНИЙ JS
========================================== -->

<script src="js/script.js"></script>


<!-- ==========================================
     ОГОЛОШЕННЯ НА ГОЛОВНІЙ
========================================== -->

<script src="js/home-announcements.js"></script>


</body>

</html>
