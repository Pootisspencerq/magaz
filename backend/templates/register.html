<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Реєстрація — VILKA</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" <href="/static/css/auth.css">
</head>

<body>

<header class="site-header">
    <div class="container">

        <nav class="navbar navbar-expand-lg">

            <a href="index.html" class="vilka-logo">
                <img src="/static/img/vilka-logo.png" alt="VILKA">
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar"
                aria-controls="mainNavbar"
                aria-expanded="false"
                aria-label="Відкрити меню"
            >
                <i class="bi bi-list"></i>
            </button>

            <div class="collapse navbar-collapse" id="mainNavbar">

                <ul class="navbar-nav me-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            Головна
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="announcements.html">
                            Оголошення
                        </a>
                    </li>

                </ul>

                <div class="header-actions">

                    <a
                        href="login.html"
                        class="btn btn-orange"
                    >
                        <i class="bi bi-person"></i>
                        Увійти
                    </a>

                    <a
                        href="cart.html"
                        class="cart-button"
                    >
                        <i class="bi bi-cart3"></i>

                        <span id="cartCount">
                            0
                        </span>
                    </a>

                </div>

            </div>

        </nav>

    </div>
</header>


<main class="auth-page">

    <div class="container">

        <div class="auth-wrapper">

            <div class="auth-card auth-card-register">

                <div class="auth-icon">
                    <i class="bi bi-person-plus"></i>
                </div>

                <h1 class="auth-title">
                    Реєстрація
                </h1>

                <p class="auth-subtitle">
                    Створіть акаунт VILKA
                </p>


                <div
                    id="registerError"
                    class="alert alert-danger d-none"
                    role="alert"
                ></div>


                <div
                    id="registerSuccess"
                    class="alert alert-success d-none"
                    role="alert"
                ></div>


                <form id="registerForm">

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label
                                for="firstName"
                                class="form-label"
                            >
                                Ім'я
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="firstName"
                                name="first_name"
                                placeholder="Ваше ім'я"
                                autocomplete="given-name"
                                required
                            >

                        </div>


                        <div class="col-md-6 mb-3">

                            <label
                                for="lastName"
                                class="form-label"
                            >
                                Прізвище
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="lastName"
                                name="last_name"
                                placeholder="Ваше прізвище"
                                autocomplete="family-name"
                                required
                            >

                        </div>

                    </div>


                    <div class="mb-3">

                        <label
                            for="username"
                            class="form-label"
                        >
                            Логін
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-person"></i>
                            </span>

                            <input
                                type="text"
                                class="form-control"
                                id="username"
                                name="username"
                                placeholder="Наприклад: test123"
                                autocomplete="username"
                                required
                            >

                        </div>

                    </div>


                    <div class="mb-3">

                        <label
                            for="email"
                            class="form-label"
                        >
                            Email
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-envelope"></i>
                            </span>

                            <input
                                type="email"
                                class="form-control"
                                id="email"
                                name="email"
                                placeholder="example@gmail.com"
                                autocomplete="email"
                                required
                            >

                        </div>

                    </div>


                    <div class="mb-3">

                        <label
                            for="phone"
                            class="form-label"
                        >
                            Телефон
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-telephone"></i>
                            </span>

                            <input
                                type="tel"
                                class="form-control"
                                id="phone"
                                name="phone"
                                placeholder="+380..."
                                autocomplete="tel"
                            >

                        </div>

                    </div>


                    <div class="mb-3">

                        <label
                            for="city"
                            class="form-label"
                        >
                            Місто
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-geo-alt"></i>
                            </span>

                            <input
                                type="text"
                                class="form-control"
                                id="city"
                                name="city"
                                placeholder="Ваше місто"
                                autocomplete="address-level2"
                            >

                        </div>

                    </div>


                    <div class="mb-3">

                        <label
                            for="password"
                            class="form-label"
                        >
                            Пароль
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-lock"></i>
                            </span>

                            <input
                                type="password"
                                class="form-control"
                                id="password"
                                name="password"
                                placeholder="Введіть пароль"
                                autocomplete="new-password"
                                required
                            >

                            <button
                                type="button"
                                class="btn password-toggle"
                                data-target="password"
                            >
                                <i class="bi bi-eye"></i>
                            </button>

                        </div>

                    </div>


                    <div class="mb-4">

                        <label
                            for="passwordConfirm"
                            class="form-label"
                        >
                            Повторіть пароль
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-shield-lock"></i>
                            </span>

                            <input
                                type="password"
                                class="form-control"
                                id="passwordConfirm"
                                name="password_confirm"
                                placeholder="Повторіть пароль"
                                autocomplete="new-password"
                                required
                            >

                            <button
                                type="button"
                                class="btn password-toggle"
                                data-target="passwordConfirm"
                            >
                                <i class="bi bi-eye"></i>
                            </button>

                        </div>

                    </div>


                    <button
                        type="submit"
                        class="btn btn-orange auth-submit"
                        id="registerButton"
                    >
                        <span id="registerButtonText">
                            Зареєструватися
                        </span>

                        <span
                            id="registerSpinner"
                            class="spinner-border spinner-border-sm d-none"
                            aria-hidden="true"
                        ></span>
                    </button>

                </form>


                <div class="auth-divider">
                    <span>або</span>
                </div>


                <div class="auth-register">

                    <p>
                        Вже маєте акаунт?
                    </p>

                    <a
                        href="login.html"
                        class="btn btn-outline-light"
                    >
                        Увійти
                    </a>

                </div>

            </div>

        </div>

    </div>

</main>


<footer class="site-footer">

    <div class="container">

        <div class="footer-content">

            <div>
                <strong>VILKA</strong>
                <p>
                    Техніка, товари та оголошення в одному місці.
                </p>
            </div>

            <div>
                <p>
                    © 2026 VILKA
                </p>
            </div>

        </div>

    </div>

</footer>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="/static/js/auth.js"></script>

</body>
</html>
