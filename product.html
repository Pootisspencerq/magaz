<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">

    <title>Товар | Мій магазин</title>
</head>

<body>

<header class="bg-white border-bottom">
    <div class="container py-3">

        <div class="row align-items-center g-3">

            <div class="col-12 col-lg-3">
                <a href="index.html" class="logo">
                    МІЙ МАГАЗИН
                </a>
            </div>

            <div class="col-12 col-lg-6">
                <input
                    type="text"
                    id="search"
                    class="form-control form-control-lg"
                    placeholder="Пошук товарів..."
                >
            </div>

            <div class="col-12 col-lg-3">
                <button
                    id="cartButton"
                    class="btn btn-orange btn-lg w-100"
                >
                    🛒 Кошик
                    <span id="cartCount" class="badge bg-dark">0</span>
                </button>
            </div>

        </div>

        <nav class="mt-3">
            <a href="index.html">Каталог</a>
            <a href="#">Комп'ютери</a>
            <a href="#">Телефони</a>
            <a href="#">Ноутбуки</a>
            <a href="#">Аксесуари</a>
        </nav>

    </div>
</header>


<main class="container py-5">

    <!-- Хлібні крихти -->
    <div class="mb-4">
        <a href="index.html" class="text-decoration-none">
            ← Повернутися до каталогу
        </a>
    </div>


    <div class="product-page">

        <!-- Фото -->
        <div class="product-gallery">

            <img
                id="productImage"
                src=""
                alt="Товар"
            >

        </div>


        <!-- Інформація -->
        <div class="product-info">

            <h1 id="productName">
                Завантаження...
            </h1>


            <div class="product-rating mb-3">

                <span id="productStars">
                    ⭐⭐⭐⭐⭐
                </span>

                <span id="productRating">
                    0
                </span>

            </div>


            <hr>


            <p
                id="productDescription"
                class="product-description"
            ></p>


            <!-- Характеристики -->
            <div class="product-features">

                <h4>Характеристики</h4>

                <div class="feature-row">
                    <span>Бренд</span>
                    <strong id="productBrand">—</strong>
                </div>

                <div class="feature-row">
                    <span>Категорія</span>
                    <strong id="productCategory">—</strong>
                </div>

                <div class="feature-row">
                    <span>Гарантія</span>
                    <strong>12 місяців</strong>
                </div>

            </div>


            <!-- Ціна -->
            <div
                id="productPrice"
                class="product-page-price"
            >
                0 грн
            </div>


            <div class="availability">
                ✓ Є в наявності
            </div>


            <!-- Кількість -->
            <div class="quantity-box">

                <span>Кількість:</span>

                <button
                    id="minusButton"
                    type="button"
                >
                    −
                </button>

                <span id="quantity">
                    1
                </span>

                <button
                    id="plusButton"
                    type="button"
                >
                    +
                </button>

            </div>


            <!-- Купити -->
            <button
                id="productBuyButton"
                class="btn btn-orange btn-lg w-100 mt-3"
            >
                🛒 Купити
            </button>

        </div>

    </div>

</main>


<footer class="bg-dark text-white text-center py-4">

    <p class="mb-0">
        © 2026 Мій магазин
    </p>

</footer>


<script src="js/product.js"></script>

</body>
</html>
