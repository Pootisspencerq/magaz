<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">

    <title>Кошик | VILKA</title>
</head>


<body>


<!-- =====================================================
     ШАПКА
===================================================== -->

<header class="bg-white border-bottom">

    <div class="container py-3">

        <div class="row align-items-center g-3">

            <!-- ЛОГОТИП -->

            <div class="col-12 col-lg-3">

                <a
                    href="index.html"
                    class="logo"
                >
                    VILKA
                </a>

            </div>


            <!-- ПОШУК -->

            <div class="col-12 col-lg-6">

                <input
                    type="text"
                    id="search"
                    class="form-control form-control-lg"
                    placeholder="Пошук товарів..."
                >

            </div>


            <!-- КОШИК -->

            <div class="col-12 col-lg-3">

                <button
                    id="cartButton"
                    class="btn btn-orange btn-lg w-100"
                    type="button"
                >

                    🛒 Кошик

                    <span
                        id="cartCount"
                        class="badge bg-dark"
                    >
                        0
                    </span>

                </button>

            </div>

        </div>


        <!-- НАВІГАЦІЯ -->

        <nav class="mt-3">

            <a href="index.html">
                Каталог
            </a>

            <a href="#">
                Комп'ютери
            </a>

            <a href="#">
                Телефони
            </a>

            <a href="#">
                Ноутбуки
            </a>

            <a href="#">
                Аксесуари
            </a>

        </nav>

    </div>

</header>



<!-- =====================================================
     ОСНОВНИЙ КОНТЕНТ
===================================================== -->

<main class="container py-5">


    <!-- ЗАГОЛОВОК -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h1 class="fw-bold mb-0">
            🛒 Кошик
        </h1>


        <a
            href="index.html"
            class="btn btn-outline-light"
        >
            ← До каталогу
        </a>

    </div>



    <!-- =================================================
         ПОРОЖНІЙ КОШИК
    ================================================= -->

    <div
        id="emptyCart"
        class="cart-empty text-center"
        style="display: none;"
    >

        <div class="empty-cart-icon">
            🛒
        </div>


        <h2>
            Ваш кошик порожній
        </h2>


        <p>
            Додайте товари, щоб вони з'явилися тут.
        </p>


        <a
            href="index.html"
            class="btn btn-orange"
        >
            Перейти до каталогу
        </a>

    </div>



    <!-- =================================================
         ВМІСТ КОШИКА
    ================================================= -->

    <div
        id="cartContent"
        style="display: none;"
    >

        <div class="row g-4">


            <!-- =========================================
                 ТОВАРИ
            ========================================= -->

            <div class="col-12 col-lg-8">

                <div id="cartItems"></div>


                <button
                    id="clearCartButton"
                    class="btn btn-outline-danger mt-3"
                    type="button"
                >
                    🗑 Очистити кошик
                </button>

            </div>



            <!-- =========================================
                 ПІДСУМОК
            ========================================= -->

            <div class="col-12 col-lg-4">

                <div class="cart-summary">


                    <h3>
                        Підсумок
                    </h3>


                    <hr>


                    <!-- КІЛЬКІСТЬ -->

                    <div class="summary-row">

                        <span>
                            Товарів:
                        </span>


                        <strong id="cartProductsCount">
                            0
                        </strong>

                    </div>



                    <!-- ВАРТІСТЬ -->

                    <div class="summary-row">

                        <span>
                            Вартість:
                        </span>


                        <strong id="cartTotal">
                            0 грн
                        </strong>

                    </div>


                    <hr>


                    <!-- РАЗОМ -->

                    <div class="summary-total">

                        <span>
                            Разом:
                        </span>


                        <strong id="cartGrandTotal">
                            0 грн
                        </strong>

                    </div>


                    <!-- ОФОРМИТИ -->

                    <button
                        id="checkoutButton"
                        class="btn btn-orange btn-lg w-100 mt-4"
                        type="button"
                    >
                        Оформити замовлення
                    </button>

                </div>

            </div>

        </div>

    </div>

</main>



<!-- =====================================================
     FOOTER
===================================================== -->

<footer class="bg-dark text-white text-center py-4">

    <p class="mb-0">
        © 2026 VILKA
    </p>

</footer>



<!-- =====================================================
     JS
===================================================== -->

<script src="js/cart.js"></script>

</body>

</html>
