
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Вхід — VILKA</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            min-height: 100vh;
            background: var(--dark, #37353E);
            color: #fff;
        }

        .login-wrapper {
            min-height: 75vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 15px;
        }

        .login-card {
            width: 100%;
            max-width: 460px;
            background: var(--dark-light, #44444E);
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 15px 45px rgba(0,0,0,.25);
        }

        .login-logo {
            width: 130px;
            max-height: 80px;
            object-fit: contain;
            margin-bottom: 15px;
        }

        .login-card h1 {
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
        }

        .login-subtitle {
            color: #bbb;
            text-align: center;
            margin-bottom: 28px;
        }

        .login-card .form-label {
            font-weight: 500;
        }

        .login-card .form-control {
            background: #37353E;
            color: #fff;
            border: 1px solid #66616d;
            border-radius: 10px;
            padding: 12px 14px;
        }

        .login-card .form-control:focus {
            border-color: var(--accent, #715A5A);
            box-shadow: 0 0 0 .2rem rgba(113,90,90,.25);
        }

        .login-card .form-control::placeholder {
            color: #999;
        }

        .password-wrapper {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #bbb;
            cursor: pointer;
        }

        .password-wrapper input {
            padding-right: 45px;
        }

        .login-submit {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            margin-top: 10px;
        }

        .login-links {
            text-align: center;
            margin-top: 22px;
            color: #bbb;
        }

        .login-links a {
            color: #fff;
            font-weight: 600;
            text-decoration: none;
        }

        .login-links a:hover {
            text-decoration: underline;
        }

        #loginMessage {
            display: none;
        }
    </style>
</head>

<body>

<header class="site-header">
    <nav class="navbar navbar-expand-lg">
        <div class="container">

            <a href="index.html" class="vilka-logo">
                <img src="img/vilka-logo.png" alt="VILKA">
            </a>

            <a href="index.html" class="btn btn-outline-light ms-auto">
                <i class="bi bi-house"></i>
                На головну
            </a>

        </div>
    </nav>
</header>

<main class="login-wrapper">

    <div class="login-card">

        <div class="text-center">
            <img
                src="img/vilka-logo.png"
                alt="VILKA"
                class="login-logo"
            >
        </div>

        <h1>Вхід до акаунту</h1>

        <p class="login-subtitle">
            Увійдіть, щоб користуватися всіма можливостями VILKA
        </p>

        <div id="loginMessage" class="alert" role="alert"></div>

        <form id="loginForm">

            <div class="mb-3">
                <label for="username" class="form-label">
                    Логін або email
                </label>

                <input
                    type="text"
                    class="form-control"
                    id="username"
                    name="username"
                    placeholder="Введіть логін або email"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">
                    Пароль
                </label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        name="password"
                        placeholder="Введіть пароль"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        id="togglePassword"
                        aria-label="Показати пароль"
                    >
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <button
                type="submit"
                class="btn btn-orange login-submit"
                id="loginButton"
            >
                <i class="bi bi-box-arrow-in-right me-1"></i>
                Увійти
            </button>

        </form>

        <div class="login-links">
            <p>
                Ще не маєте акаунту?
                <a href="register.html">Зареєструватися</a>
            </p>

            <a href="index.html">
                Повернутися до магазину
            </a>
        </div>

    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
