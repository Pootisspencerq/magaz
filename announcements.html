<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Оголошення — VILKA</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/announcements.css">
</head>

<body>

<header class="site-header">
    <nav class="navbar navbar-expand-lg">

        <div class="container">

            <a class="navbar-brand vilka-logo" href="index.html">
                <img src="img/vilka-logo.png" alt="VILKA">
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar"
                aria-controls="mainNavbar"
                aria-expanded="false"
                aria-label="Відкрити меню"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNavbar">

                <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            Каталог
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link active"
                            href="announcements.html"
                        >
                            Оголошення
                        </a>
                    </li>

                </ul>

                <div class="header-actions d-flex align-items-center gap-2">

                    <input
                        type="search"
                        id="search"
                        class="form-control header-search"
                        placeholder="Пошук..."
                        aria-label="Пошук"
                    >

                    <button
                        id="cartButton"
                        class="btn btn-orange"
                        type="button"
                    >
                        <i class="bi bi-cart3 me-2"></i> Кошик
                        <span id="cartCount">0</span>
                    </button>

                </div>

            </div>

        </div>

    </nav>
</header>


<main class="container py-5">

    <!-- Заголовок -->

    <section class="announcements-header">

        <div>
            <h1>Оголошення</h1>

            <p>
                Купуйте та продавайте техніку на нашому майданчику
            </p>
        </div>

        <button
            id="showCreateButton"
            class="btn btn-orange"
            type="button"
        >
            <i class="bi bi-plus-lg me-2"></i> Додати оголошення
        </button>

    </section>


    <!-- Форма створення -->

    <section
        id="createAnnouncement"
        class="announcement-form-card d-none"
    >

        <div class="form-card-header">

            <h2>
                Нове оголошення
            </h2>

            <button
                id="closeCreateButton"
                class="btn-close-custom"
                type="button"
                aria-label="Закрити"
            >
                <i class="bi bi-plus-lg me-2"></i>
            </button>

        </div>


        <form
            id="announcementForm"
            enctype="multipart/form-data"
        >

            <div class="row g-3">

                <!-- Назва -->

                <div class="col-12">

                    <label
                        for="title"
                        class="form-label"
                    >
                        Назва товару *
                    </label>

                    <input
                        type="text"
                        id="title"
                        name="title"
                        class="form-control"
                        maxlength="200"
                        placeholder="Наприклад: iPhone 15 Pro 256GB"
                        required
                    >

                </div>


                <!-- Ціна -->

                <div class="col-md-6">

                    <label
                        for="price"
                        class="form-label"
                    >
                        Ціна, грн *
                    </label>

                    <input
                        type="number"
                        id="price"
                        name="price"
                        class="form-control"
                        min="1"
                        step="0.01"
                        placeholder="25000"
                        required
                    >

                </div>


                <!-- Категорія -->

                <div class="col-md-6">

                    <label
                        for="category"
                        class="form-label"
                    >
                        Категорія *
                    </label>

                    <select
                        id="category"
                        name="category"
                        class="form-select"
                        required
                    >

                        <option value="computers">
                            Комп'ютери
                        </option>

                        <option value="phones">
                            Телефони
                        </option>

                        <option value="laptops">
                            Ноутбуки
                        </option>

                        <option value="accessories">
                            Аксесуари
                        </option>

                        <option value="gaming">
                            Ігрова техніка
                        </option>

                        <option value="other" selected>
                            Інше
                        </option>

                    </select>

                </div>


                <!-- Стан -->

                <div class="col-md-6">

                    <label
                        for="condition"
                        class="form-label"
                    >
                        Стан *
                    </label>

                    <select
                        id="condition"
                        name="condition"
                        class="form-select"
                        required
                    >

                        <option value="new">
                            Новий
                        </option>

                        <option value="used" selected>
                            Вживаний
                        </option>

                    </select>

                </div>


                <!-- Місто -->

                <div class="col-md-6">

                    <label
                        for="city"
                        class="form-label"
                    >
                        Місто *
                    </label>

                    <input
                        type="text"
                        id="city"
                        name="city"
                        class="form-control"
                        maxlength="100"
                        placeholder="Львів"
                        required
                    >

                </div>


                <!-- Продавець -->

                <div class="col-md-6">

                    <label
                        for="sellerName"
                        class="form-label"
                    >
                        Ім'я продавця *
                    </label>

                    <input
                        type="text"
                        id="sellerName"
                        name="seller_name"
                        class="form-control"
                        maxlength="100"
                        placeholder="Ваше ім'я"
                        required
                    >

                </div>


                <!-- Телефон -->

                <div class="col-md-6">

                    <label
                        for="phone"
                        class="form-label"
                    >
                        Телефон *
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        class="form-control"
                        maxlength="30"
                        placeholder="+380..."
                        required
                    >

                </div>


                <!-- Опис -->

                <div class="col-12">

                    <label
                        for="description"
                        class="form-label"
                    >
                        Опис *
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        class="form-control"
                        rows="5"
                        placeholder="Опишіть товар, його стан, комплектацію та інші важливі деталі..."
                        required
                    ></textarea>

                </div>


                <!-- Фото -->

                <div class="col-12">

                    <label
                        for="image"
                        class="form-label"
                    >
                        Фото товару
                    </label>

                    <input
                        type="file"
                        id="image"
                        name="image"
                        class="form-control"
                        accept="image/*"
                    >

                    <div class="form-help">
                        Можна додати одне фото товару.
                    </div>

                </div>

            </div>


            <!-- Помилка -->

            <div
                id="formError"
                class="alert alert-danger d-none mt-4"
            ></div>


            <!-- Кнопки -->

            <div class="form-actions mt-4">

                <button
                    type="submit"
                    id="submitAnnouncement"
                    class="btn btn-orange"
                >
                    Опублікувати оголошення
                </button>

                <button
                    type="button"
                    id="cancelAnnouncement"
                    class="btn btn-secondary"
                >
                    Скасувати
                </button>

            </div>

        </form>

    </section>


    <!-- Завантаження -->

    <div
        id="loading"
        class="announcements-loading"
    >
        Завантаження оголошень...
    </div>


    <!-- Загальна помилка -->

    <div
        id="errorMessage"
        class="alert alert-danger d-none"
    ></div>


    <!-- Немає оголошень -->

    <div
        id="emptyAnnouncements"
        class="empty-announcements d-none"
    >

        <div class="empty-icon">
            <i class="bi bi-megaphone"></i>
        </div>

        <h2>
            Оголошень поки немає
        </h2>

        <p>
            Станьте першим, хто додасть оголошення.
        </p>

        <button
            id="emptyCreateButton"
            class="btn btn-orange"
            type="button"
        >
            Додати оголошення
        </button>

    </div>


    <!-- Список оголошень -->

    <div
        id="announcements"
        class="row g-4"
    ></div>

</main>


<footer class="py-4 mt-5">

    <div class="container text-center">

        © 2026 VILKA

    </div>

</footer>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/announcements.js"></script>

</body>
</html>
